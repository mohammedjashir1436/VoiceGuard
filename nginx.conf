# VoiceGuard — Docker Compose reverse proxy (single entry point on :80).
#
# Mounted into the nginx container at /etc/nginx/conf.d/default.conf, so this is
# a `server` block only (the stock nginx.conf provides the events/http wrappers).
#
# Routing:
#   /        -> frontend container
#   /api/    -> backend FastAPI on :8000 (the /api prefix is stripped)
#   /token   -> backend FastAPI login endpoint
#   /ws/     -> backend WebSocket (live mic), prefix preserved
#   /twilio/ -> backend WebSocket (Twilio Media Streams), prefix preserved

server {
    listen 80;
    server_name _;

    client_max_body_size 100M;

    # Security headers.
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    add_header Content-Security-Policy "default-src 'self'; script-src 'self' blob:; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self' blob:; connect-src 'self' ws: wss:; frame-ancestors 'self'";

    # ============================================================
    # React SPA
    # ============================================================

    location / {
        proxy_pass http://frontend:80;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ============================================================
    # FastAPI LOGIN
    #
    # Frontend currently sends:
    # POST /token
    #
    # This must go directly to FastAPI instead of the React frontend.
    # ============================================================

    location = /token {
        proxy_pass http://backend:8000/token;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ============================================================
    # FastAPI BACKEND
    #
    # /api/detect -> backend:8000/detect
    # /api/health -> backend:8000/health
    # etc.
    # ============================================================

    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ============================================================
    # WebSocket — live microphone stream
    #
    # /api/ws/stream -> backend:8000/ws/stream
    # ============================================================

    location /api/ws/ {
        proxy_pass http://backend:8000/ws/;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;

        proxy_read_timeout 3600s;
    }

    # ============================================================
    # Legacy root-path WebSocket
    #
    # /ws/ -> backend:8000/ws/
    # ============================================================

    location /ws/ {
        proxy_pass http://backend:8000/ws/;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;

        proxy_read_timeout 3600s;
    }

    # ============================================================
    # Twilio Media Streams WebSocket
    #
    # /twilio/ -> backend:8000/twilio/
    # ============================================================

    location /twilio/ {
        proxy_pass http://backend:8000/twilio/;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 3600s;
    }
}